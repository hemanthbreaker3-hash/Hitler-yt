{% extends "base.html" %}
{% block title %}HITLER YT · Movies & Series{% endblock %}
{% block nav_home %}active{% endblock %}
{% block content %}
<div class="page-hero">
  <div>
    <h1>Discover media</h1>
    <p>Browse the catalog, open a title, then stream or get files in Telegram.</p>
  </div>
</div>

<form class="search-bar" action="/search" method="get" role="search">
  <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
  <input name="q" placeholder="Search movies, series, or keywords…" autocomplete="off" maxlength="100" aria-label="Search catalog">
  <button type="submit">Search</button>
</form>

<div id="trending-row" class="trending-row" style="display:none" aria-label="Trending"></div>

<div class="section-head" id="catalog">
  <h2>Catalog</h2>
  <span class="chip" id="result-count">Loading…</span>
</div>
<div class="cat-nav" id="category-nav"></div>
<div class="poster-grid" id="catalog-grid">
  <p class="muted" style="grid-column:1/-1;padding:48px 0;text-align:center">Loading titles…</p>
</div>

<script>
(async () => {
  const grid = document.getElementById('catalog-grid');
  const nav = document.getElementById('category-nav');
  const countEl = document.getElementById('result-count');
  const trend = document.getElementById('trending-row');
  const params = new URLSearchParams(location.search);
  let category = params.get('category') || '';
  let q = params.get('q') || '';

  function posterUrl(p) {
    if (!p) return '/static/images/poster.jpg';
    if (String(p).startsWith('http')) return p;
    return 'https://image.tmdb.org/t/p/w500' + p;
  }

  function card(p) {
    const a = document.createElement('a');
    a.className = 'poster-card';
    a.href = '/title/' + encodeURIComponent(p.slug);
    const img = document.createElement('img');
    img.src = posterUrl(p.poster_path);
    img.alt = (p.title || 'Poster') + ' poster';
    img.loading = 'lazy';
    const info = document.createElement('div');
    info.className = 'info';
    const t = document.createElement('div');
    t.className = 'title';
    const year = (p.release_date || '').slice(0, 4);
    t.textContent = (p.title || 'Untitled') + (year ? ' (' + year + ')' : '');
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = [p.media_type || '', p.rating != null ? '★ ' + p.rating : ''].filter(Boolean).join(' · ');
    info.appendChild(t);
    info.appendChild(m);
    a.appendChild(img);
    a.appendChild(info);
    return a;
  }

  function chip(label, value, active) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (active ? ' active' : '');
    b.textContent = label;
    b.onclick = () => {
      category = value;
      const url = new URL(location.href);
      if (category) url.searchParams.set('category', category); else url.searchParams.delete('category');
      if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
      history.replaceState(null, '', url);
      load();
      nav.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      b.classList.add('active');
    };
    return b;
  }

  async function load() {
    try {
      const qs = new URLSearchParams();
      if (category) qs.set('category', category);
      if (q) qs.set('q', q);
      const r = await fetch('/api/public/catalog?' + qs.toString(), { cache: 'no-store' });
      if (!r.ok) throw new Error('Catalog API returned HTTP ' + r.status);
      const data = await r.json();
      const list = Array.isArray(data.items) ? data.items : (Array.isArray(data) ? data : []);
      const cats = Array.isArray(data.categories) ? data.categories : [];

      countEl.textContent = list.length ? list.length + ' titles' : '0 titles';
      nav.innerHTML = '';
      nav.appendChild(chip('All', '', !category));
      cats.forEach(c => nav.appendChild(chip(c.name || c.slug, c.slug, category === c.slug)));

      grid.innerHTML = '';
      if (!list.length) {
        trend.style.display = 'none';
        grid.innerHTML = '<p class="muted" style="grid-column:1/-1;padding:48px 0;text-align:center">No titles found. Publish movies or series from the bot or the panel.</p>';
        return;
      }
      list.forEach(p => grid.appendChild(card(p)));

      const top = list.slice(0, 12);
      if (top.length) {
        trend.style.display = 'flex';
        trend.innerHTML = '';
        top.forEach(p => {
          const a = document.createElement('a');
          a.className = 'trending-item';
          a.href = '/title/' + encodeURIComponent(p.slug);
          a.title = p.title || '';
          const img = document.createElement('img');
          img.src = posterUrl(p.poster_path);
          img.alt = p.title || 'Poster';
          img.loading = 'lazy';
          a.appendChild(img);
          trend.appendChild(a);
        });
      } else {
        trend.style.display = 'none';
      }
    } catch (err) {
      const safeMessage = String(err && err.message ? err.message : err).replace(/[<>&]/g, '');
      grid.innerHTML = '<div style="grid-column:1/-1;padding:40px 16px;text-align:center;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius)"><strong style="display:block;font-size:17px;margin-bottom:8px">Catalog temporarily unavailable</strong><p class="muted" style="margin-bottom:14px">' + safeMessage + '</p><button class="btn btn-yellow" type="button" id="catalog-retry">Try again</button></div>';
      const btn = document.getElementById('catalog-retry');
      if (btn) btn.onclick = load;
      countEl.textContent = 'Error';
    }
  }

  load();
})();
</script>
{% endblock %}

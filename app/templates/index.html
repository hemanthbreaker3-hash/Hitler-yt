{% extends "base.html" %}
{% block title %}{{ BRANDING }} · Movies & Series{% endblock %}
{% block nav_home %}active{% endblock %}
{% block head %}
<style>
  .pager-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin:24px 0;flex-wrap:wrap}
  .pager-bar[hidden]{display:none!important}
  .pager-bar button{background:var(--bg-card);border:1px solid var(--line-strong);color:var(--text);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:700;font-size:13px}
  .pager-bar button:disabled{opacity:.4;cursor:not-allowed}
  .pager-bar button.active{background:linear-gradient(125deg,var(--accent),var(--accent-2));color:#061019;border-color:transparent}
</style>
{% endblock %}
{% block content %}
<form class="search-bar" action="/search" method="get" role="search">
  <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
  <input name="q" placeholder="Search your favourite content…" autocomplete="off" maxlength="100" aria-label="Search catalog">
  <button type="submit">Search</button>
</form>

<section class="hero-spotlight" id="hero-spotlight" hidden>
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-scrim"></div>
  <div class="hero-body">
    <span class="hero-kicker"><i class="fa-solid fa-bolt"></i> Featured</span>
    <h1 id="hero-title"></h1>
    <div class="hero-meta" id="hero-meta"></div>
    <a class="btn btn-accent" id="hero-cta" href="#"><i class="fa-solid fa-play"></i> Watch &amp; Download</a>
  </div>
</section>

<div class="cat-nav" id="category-nav"></div>

<div class="section-head" id="catalog">
  <h2>Now Showing</h2>
  <span class="chip" id="result-count">Loading…</span>
</div>

<div class="poster-grid" id="catalog-grid">
  <p class="muted" style="grid-column:1/-1;padding:48px 0;text-align:center">Loading titles…</p>
</div>
<div id="catalog-pagination" class="pager-bar" hidden aria-label="Catalog pagination"></div>

<script>
window.__INITIAL_CATALOG__ = {{ initial_items|default([])|tojson }};
window.__INITIAL_CATEGORIES__ = {{ initial_categories|default([])|tojson }};
(async () => {
  const grid = document.getElementById('catalog-grid');
  const nav = document.getElementById('category-nav');
  const countEl = document.getElementById('result-count');
  let catalogPage = 1;
  const CATALOG_PER_PAGE = 12;
  let catalogItems = [];
  const params = new URLSearchParams(location.search);
  let category = params.get('category') || '';
  let q = params.get('q') || '';

  function tmdbUrl(path, size) {
    if (!path) return '';
    if (String(path).startsWith('http')) return path;
    return 'https://image.tmdb.org/t/p/' + size + path;
  }

  function homeImageUrl(p) {
    if (p && p.backdrop_path) return tmdbUrl(p.backdrop_path, 'w1280');
    return tmdbUrl(p && p.poster_path, 'w780') || '/static/images/poster.jpg';
  }

  async function fillMissingBackdrops() {
    const imgs = Array.from(document.querySelectorAll('#catalog-grid img[data-needs-backdrop="1"]'));
    if (!imgs.length) return;
    const BATCH = 6;
    for (let i = 0; i < imgs.length; i += BATCH) {
      await Promise.all(imgs.slice(i, i + BATCH).map(async (img) => {
        const id = img.dataset.tmdbId || '';
        const title = img.dataset.title || '';
        const slug = img.dataset.slug || '';
        const mt = (img.dataset.mediaType || 'movie').toLowerCase() === 'tv' ? 'tv' : 'movie';
        if (!id && !title) return;
        try {
          const qs = new URLSearchParams({ type: mt });
          if (id) qs.set('id', id);
          if (title) qs.set('title', title);
          if (slug) qs.set('slug', slug);
          const r = await fetch('/api/tmdb-backdrop?' + qs.toString(), { cache: 'force-cache' });
          if (!r.ok) return;
          const d = await r.json();
          if (d && d.backdrop_path) {
            img.src = tmdbUrl(d.backdrop_path, 'w1280');
            img.removeAttribute('data-needs-backdrop');
            const hit = catalogItems.find(x => x.slug === slug);
            if (hit) hit.backdrop_path = d.backdrop_path;
          }
        } catch (_) {}
      }));
    }
  }

  function card(p) {
    const a = document.createElement('a');
    a.className = 'poster-card';
    a.href = '/title/' + encodeURIComponent(p.slug);

    const media = document.createElement('div');
    media.className = 'card-media';
    const img = document.createElement('img');
    img.src = homeImageUrl(p);
    if (!(p && p.backdrop_path) && p && (p.tmdb_id || p.title)) {
      img.dataset.needsBackdrop = '1';
      if (p.tmdb_id) img.dataset.tmdbId = String(p.tmdb_id);
      if (p.title) img.dataset.title = String(p.title);
      if (p.slug) img.dataset.slug = String(p.slug);
      img.dataset.mediaType = String(p.media_type || 'movie');
    }
    img.alt = (p.title || 'Poster') + ' backdrop';
    img.loading = 'lazy';
    img.decoding = 'async';

    const play = document.createElement('div');
    play.className = 'play-hint';
    play.innerHTML = '<span>▶</span>';

    const topBadges = document.createElement('div');
    topBadges.className = 'card-top-badges';
    const qPill = document.createElement('span');
    qPill.className = 'badge-quality';
    qPill.textContent = '1080P';
    topBadges.appendChild(qPill);
    const rVal = Number(p && p.rating);
    if (Number.isFinite(rVal) && rVal > 0) {
      const rPill = document.createElement('span');
      rPill.className = 'badge-rating';
      rPill.textContent = '★ ' + rVal.toFixed(1);
      topBadges.appendChild(rPill);
    }
    media.append(img, play, topBadges);

    const info = document.createElement('div');
    info.className = 'info';
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = p.title || 'Untitled';

    const metaRow = document.createElement('div');
    metaRow.className = 'card-meta-row';
    const meta = document.createElement('div');
    meta.className = 'meta';
    const year = (p.release_date || p.first_air_date || '').toString().slice(0, 4);
    const kind = String(p.media_type || '').toLowerCase() === 'tv' ? 'SERIES' : 'MOVIE';
    meta.textContent = [year, kind].filter(Boolean).join(' · ');
    metaRow.appendChild(meta);
    if (Array.isArray(p.genres) && p.genres.length) {
      const g = document.createElement('span');
      g.className = 'badge-genre';
      g.textContent = String(p.genres[0]).toUpperCase();
      metaRow.appendChild(g);
    }

    info.append(title, metaRow);
    a.append(media, info);
    return a;
  }


  function renderSpotlight(items) {
    const box = document.getElementById('hero-spotlight');
    if (!box) return;
    const pick = Array.isArray(items) && items.length ? (items.find(x => x && x.backdrop_path) || items[0]) : null;
    if (!pick || !pick.slug) { box.hidden = true; return; }
    const bg = document.getElementById('hero-bg');
    const title = document.getElementById('hero-title');
    const meta = document.getElementById('hero-meta');
    const cta = document.getElementById('hero-cta');
    if (bg) bg.style.backgroundImage = 'url("' + homeImageUrl(pick).replace(/"/g, '\"') + '")';
    if (title) title.textContent = pick.title || 'Featured Title';
    const year = (pick.release_date || pick.first_air_date || '').toString().slice(0, 4);
    const kind = String(pick.media_type || '').toLowerCase() === 'tv' ? 'Series' : 'Movie';
    const genre = Array.isArray(pick.genres) && pick.genres.length ? pick.genres[0] : '';
    if (meta) meta.textContent = [kind, year, genre].filter(Boolean).join(' · ');
    if (cta) cta.href = '/title/' + encodeURIComponent(pick.slug);
    box.hidden = false;
  }

  function renderCatalogPage() {
    const pages = Math.max(1, Math.ceil(catalogItems.length / CATALOG_PER_PAGE));
    catalogPage = Math.min(Math.max(1, catalogPage), pages);
    grid.innerHTML = '';
    catalogItems.slice((catalogPage - 1) * CATALOG_PER_PAGE, catalogPage * CATALOG_PER_PAGE).forEach(p => grid.appendChild(card(p)));
    fillMissingBackdrops();
    const pager = document.getElementById('catalog-pagination');
    if (pager) {
      pager.hidden = pages <= 1;
      pager.innerHTML = '';
      if (pages > 1) {
        const make = (label, page, disabled = false, active = false) => {
          const b = document.createElement('button');
          b.type = 'button'; b.textContent = label; b.disabled = disabled;
          if (active) b.classList.add('active');
          b.onclick = () => { catalogPage = page; renderCatalogPage(); document.getElementById('catalog')?.scrollIntoView({behavior:'smooth',block:'start'}); };
          pager.appendChild(b);
        };
        const dots = () => {
          const s = document.createElement('span');
          s.textContent = '…';
          s.style.cssText = 'color:var(--muted);padding:0 4px;font-weight:700';
          pager.appendChild(s);
        };
        make('‹', catalogPage - 1, catalogPage <= 1);
        const nums = new Set([1, pages, catalogPage - 1, catalogPage, catalogPage + 1].filter(n => n >= 1 && n <= pages));
        const sorted = Array.from(nums).sort((x, y) => x - y);
        let prev = 0;
        for (const n of sorted) {
          if (prev && n - prev > 1) dots();
          make(String(n), n, false, n === catalogPage);
          prev = n;
        }
        make('›', catalogPage + 1, catalogPage >= pages);
      }
    }
  }

  function chip(label, value, active) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (active ? ' active' : '');
    b.textContent = label;
    b.onclick = () => {
      category = value;
      const url = new URL(location.href);
      if (category) url.searchParams.set('category', category); else url.searchParams.delete('category');
      if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
      history.replaceState(null, '', url);
      load();
      nav.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      b.classList.add('active');
    };
    return b;
  }

  async function load() {
    try {
      const qs = new URLSearchParams();
      if (category) qs.set('category', category);
      if (q) qs.set('q', q);
      const r = await fetch('/api/catalog?' + qs.toString(), { cache: 'no-store' });
      if (!r.ok) throw new Error('Catalog API returned HTTP ' + r.status);
      const data = await r.json();
      const list = Array.isArray(data.items) ? data.items : (Array.isArray(data) ? data : []);
      let cats = Array.isArray(data.categories) ? data.categories : [];
      if (!cats.length) {
        try {
          const cr = await fetch('/api/categories', { cache: 'no-store' });
          if (cr.ok) { const cd = await cr.json(); cats = Array.isArray(cd.items) ? cd.items : []; }
        } catch (_) {}
      }
      countEl.textContent = list.length + (list.length === 1 ? ' title' : ' titles');
      nav.innerHTML = '';
      nav.appendChild(chip('All', '', !category));
      cats.forEach(c => nav.appendChild(chip(c.name || c.slug, c.slug, category === c.slug)));
      if (!list.length) {
        grid.innerHTML = '<p class="muted" style="grid-column:1/-1;padding:48px 0;text-align:center">No titles found. Publish movies or series from the bot or panel.</p>';
        document.getElementById('catalog-pagination').hidden = true;
        return;
      }
      catalogItems = list;
      renderSpotlight(list);
      catalogPage = 1;
      renderCatalogPage();
    } catch (err) {
      const safeMessage = String(err && err.message ? err.message : err).replace(/[<>&]/g, '');
      grid.innerHTML = '<div style="grid-column:1/-1;padding:40px 16px;text-align:center;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius)"><strong style="display:block;font-size:17px;margin-bottom:8px">Catalog temporarily unavailable</strong><p class="muted" style="margin-bottom:14px">' + safeMessage + '</p><button class="btn btn-yellow" type="button" id="catalog-retry">Try again</button></div>';
      document.getElementById('catalog-retry')?.addEventListener('click', load);
      countEl.textContent = 'Error';
    }
  }

  // Instant synchronous render from server-embedded catalog (zero Loading delay)
  if (Array.isArray(window.__INITIAL_CATEGORIES__) && window.__INITIAL_CATEGORIES__.length) {
    nav.innerHTML = '';
    nav.appendChild(chip('All', '', !category));
    window.__INITIAL_CATEGORIES__.forEach(c => nav.appendChild(chip(c.name || c.slug, c.slug, category === c.slug)));
  }
  if (Array.isArray(window.__INITIAL_CATALOG__) && window.__INITIAL_CATALOG__.length && !category && !q) {
    catalogItems = window.__INITIAL_CATALOG__;
    renderSpotlight(catalogItems);
    countEl.textContent = catalogItems.length + (catalogItems.length === 1 ? ' title' : ' titles');
    catalogPage = 1;
    renderCatalogPage();
  }
  load();
})();
</script>
{% endblock %}

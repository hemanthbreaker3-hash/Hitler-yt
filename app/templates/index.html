{% extends "base.html" %}
{% block title %}HITLER YT · Movies & Series{% endblock %}
{% block content %}

<!-- Trending / Top row (horizontal) -->
<div id="trending-row" class="trending-row" style="display:none"></div>

<!-- Search bar -->
<form class="search-bar" action="/search" method="get">
  <i class="fa-solid fa-magnifying-glass" style="color:#6b7280;font-size:14px"></i>
  <input name="q" value="{{ request.query_params.get('q','') }}" placeholder="Search movies & series..." autocomplete="off">
  <button type="submit">Search</button>
</form>

<!-- Category chips -->
<div class="section-head" id="catalog">
  <h2>Latest Releases</h2>
  <span class="chip" id="result-count">Loading…</span>
</div>
<div class="cat-nav" id="category-nav"></div>

<!-- Poster grid -->
<div class="poster-grid" id="catalog-grid">
  <p class="muted" style="grid-column:1/-1;padding:40px 0;text-align:center">Loading titles…</p>
</div>

<script>
(async () => {
  const q = new URLSearchParams(location.search).get('q') || '';
  let category = new URLSearchParams(location.search).get('category') || '';

  // Category nav
  try {
    const cats = await (await fetch('/api/categories')).json();
    const nav = document.getElementById('category-nav');
    const makeChip = (label, slug) => {
      const b = document.createElement('button');
      b.className = 'chip' + (category === slug ? ' active' : '');
      b.textContent = label;
      b.onclick = () => {
        category = slug;
        const url = new URL(location.href);
        if (slug) url.searchParams.set('category', slug); else url.searchParams.delete('category');
        if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
        history.replaceState(null, '', url);
        load();
        // update active
        nav.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        b.classList.add('active');
      };
      return b;
    };
    nav.append(makeChip('All', ''));
    for (const c of (cats.items || [])) {
      nav.append(makeChip(c.name, c.slug));
    }
  } catch (e) {}

  function qualityLine(p) {
    // Build a realistic quality string like the screenshot
    const type = (p.media_type || 'movie').toLowerCase();
    const year = (p.release_date || '').slice(0, 4) || '';
    const parts = [];
    if (type === 'tv' || type === 'series') parts.push('WEB-DL');
    else parts.push('WEB-DL');
    parts.push('[Hindi]');
    parts.push('1080p 720p & 480p');
    parts.push('[x264/HEVC]');
    if (type === 'tv' || type === 'series') parts.push('| [Series]');
    else parts.push('| Full Movie');
    if (p.overview && p.overview.length > 10) {
      // use first sentence-ish of overview if short
      const short = p.overview.replace(/\s+/g, ' ').trim().slice(0, 60);
      if (short.length > 15) return short + (p.overview.length > 60 ? '…' : '');
    }
    return parts.join(' ');
  }

  async function load() {
    try {
      const params = new URLSearchParams();
      if (q) params.set('q', q);
      if (category) params.set('category', category);
      const r = await fetch('/api/catalog?' + params.toString(), { cache: 'no-store' });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.message || d.detail || ('Catalog API returned HTTP ' + r.status));
      const el = document.getElementById('catalog-grid');
      const countEl = document.getElementById('result-count');
      el.innerHTML = '';
      const items = d.items || [];
      countEl.textContent = items.length ? items.length + ' titles' : '0 titles';

      if (!items.length) {
        el.innerHTML = '<p class="muted" style="grid-column:1/-1;padding:40px 0;text-align:center">No titles found. Try another search or check back later.</p>';
        return;
      }

      // Trending row (first 8)
      const trend = document.getElementById('trending-row');
      if (!q && items.length) {
        trend.style.display = 'flex';
        trend.innerHTML = '';
        items.slice(0, 10).forEach(p => {
          const a = document.createElement('a');
          a.className = 'trending-item';
          a.href = '/title/' + encodeURIComponent(p.slug);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = p.poster_path?.startsWith('http') ? p.poster_path : (p.poster_path ? 'https://image.tmdb.org/t/p/w300' + p.poster_path : '/static/images/poster.jpg');
          img.alt = p.title;
          a.append(img);
          trend.append(a);
        });
      } else {
        trend.style.display = 'none';
      }

      for (const p of items) {
        const a = document.createElement('a');
        a.className = 'poster-card';
        a.href = '/title/' + encodeURIComponent(p.slug);
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = p.poster_path?.startsWith('http') ? p.poster_path : (p.poster_path ? 'https://image.tmdb.org/t/p/w500' + p.poster_path : '/static/images/poster.jpg');
        img.alt = p.title;
        const info = document.createElement('div');
        info.className = 'info';
        const t = document.createElement('div');
        t.className = 'title';
        t.textContent = p.title + (p.release_date ? ' (' + (p.release_date.slice(0,4) || '') + ')' : '');
        const m = document.createElement('div');
        m.className = 'meta';
        m.textContent = qualityLine(p);
        info.append(t, m);
        a.append(img, info);
        el.append(a);
      }
    } catch (e) {
      const message = (e && e.message) ? e.message : 'Catalog request failed';
      document.getElementById('catalog-grid').innerHTML = '<p class="muted" style="grid-column:1/-1;padding:40px 0;text-align:center">Unable to load titles right now. ' + String(message).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])) + '</p>';
      document.getElementById('result-count').textContent = 'Error';
    }
  }
  await load();
})();
</script>
{% endblock %}

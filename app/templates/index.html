{% extends "base.html" %}
{% block title %}{{ BRANDING }} · Movies & Series{% endblock %}
{% block nav_home %}active{% endblock %}
{% block content %}
<style>#catalog-pagination[hidden]{display:none!important}#catalog-pagination button{background:var(--bg-card);border:1px solid var(--line-strong);color:var(--text);border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:700}#catalog-pagination button:disabled{opacity:.4;cursor:not-allowed}#catalog-pagination button.active{background:linear-gradient(125deg,var(--accent),var(--accent-2));color:#180b02;border-color:transparent}</style>
<style>
.home-cinema{position:relative;margin:22px 0 28px;min-height:clamp(300px,42vw,500px);border:1px solid rgba(255,255,255,.09);border-radius:24px;overflow:hidden;background:#101116;box-shadow:0 28px 80px rgba(0,0,0,.48)}
.home-cinema .backdrop-img{filter:saturate(.86);transform:scale(1.015)}
.home-cinema .backdrop-scrim{background:linear-gradient(90deg,rgba(4,5,8,.94) 0%,rgba(4,5,8,.68) 48%,rgba(4,5,8,.08) 100%),linear-gradient(0deg,rgba(4,5,8,.68),transparent 52%)}
.home-cinema .backdrop-content{padding:clamp(22px,5vw,54px);max-width:760px}
.home-cinema #homeHeroTitle{font-size:clamp(2rem,5.2vw,4rem)!important;letter-spacing:-.045em!important;background:linear-gradient(100deg,#fff 10%,#f2dfb7 65%,#d8b36a)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
.home-cinema .hero-eyebrow{letter-spacing:.24em!important;color:#d8b36a!important}
#trending-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:16px}
@media(max-width:600px){.home-cinema{min-height:330px;border-radius:18px}.home-cinema .backdrop-scrim{background:linear-gradient(0deg,rgba(4,5,8,.94),rgba(4,5,8,.2) 100%)}#trending-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}}
</style>
<form class="search-bar" action="/search" method="get" role="search">
  <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
  <input name="q" placeholder="Search your favourite content…" autocomplete="off" maxlength="100" aria-label="Search catalog">
  <button type="submit">Search</button>
</form>


<div class="section-head" id="catalog">
  <h2>Now Showing</h2>
  <span class="chip" id="result-count">Loading…</span>
</div>
<div class="cat-nav" id="category-nav"></div>
<div class="poster-grid" id="catalog-grid">
  <p class="muted" style="grid-column:1/-1;padding:48px 0;text-align:center">Loading titles…</p>
</div>
<div id="catalog-pagination" class="related-pager" hidden aria-label="Catalog pagination" style="display:flex;align-items:center;justify-content:center;gap:8px;margin:20px 0;flex-wrap:wrap"></div>

<script>
(async () => {
  const grid = document.getElementById('catalog-grid');
  const nav = document.getElementById('category-nav');
  const countEl = document.getElementById('result-count');
  const trend = null;
  let catalogPage = 1;
  const CATALOG_PER_PAGE = 24;
  let catalogItems = [];
  const params = new URLSearchParams(location.search);
  let category = params.get('category') || '';
  let q = params.get('q') || '';

  function posterUrl(p) {
    if (!p) return '/static/images/poster.jpg';
    if (String(p).startsWith('http')) return p;
    return 'https://image.tmdb.org/t/p/w780' + p;
  }

  function backdropUrl(p) {
    if (!p) return '';
    if (String(p).startsWith('http')) return p;
    return 'https://image.tmdb.org/t/p/w1280' + p;
  }

  function homeImageUrl(p) {
    // Landscape from TMDB backdrop on home; portrait only as last fallback
    if (p && p.backdrop_path) return backdropUrl(p.backdrop_path);
    return posterUrl(p && p.poster_path);
  }

  async function fillMissingBackdrops() {
    // Fetch landscape artwork for every visible existing catalog page with a TMDB ID.
    // Parallel batches avoid serial delays while keeping TMDB/backend load modest.
    const imgs = Array.from(document.querySelectorAll('#catalog-grid img[data-tmdb-id]'));
    if (!imgs.length) return;
    for (let start = 0; start < imgs.length; start += 6) {
      await Promise.all(imgs.slice(start, start + 6).map(async (img) => {
        const id = img.dataset.tmdbId;
        const mt = (img.dataset.mediaType || 'movie').toLowerCase() === 'tv' ? 'tv' : 'movie';
        try {
          const r = await fetch('/api/tmdb-backdrop?id=' + encodeURIComponent(id) + '&type=' + mt, { cache: 'force-cache' });
          if (!r.ok) return;
          const d = await r.json();
          if (d && d.backdrop_path) {
            img.src = d.backdrop_path.startsWith('http') ? d.backdrop_path : ('https://image.tmdb.org/t/p/w1280' + d.backdrop_path);
            img.removeAttribute('data-tmdb-id');
          }
        } catch (e) {}
      }));
    }
  }

  function applyHero(list) {
    const pick = list.find(x => x.backdrop_path) || list[0];
    if (!pick) return;
    const heroImg = document.getElementById('homeHeroImg');
    const heroTitle = document.getElementById('homeHeroTitle');
    const heroOverview = document.getElementById('homeHeroOverview');
    const heroActions = document.getElementById('homeHeroActions');
    const bg = backdropUrl(pick.backdrop_path) || posterUrl(pick.poster_path);
    if (heroImg && bg) heroImg.style.backgroundImage = 'url("' + bg.replace(/"/g, '\\"') + '")';
    if (heroTitle) heroTitle.textContent = pick.title || 'Discover Your Next Favourite';
    if (heroOverview) heroOverview.textContent = pick.overview || 'Explore the worlds you love. Discover your next movie, anime or series.';
    if (heroActions) {
      heroActions.innerHTML = '';
      const meta = document.createElement('div');
      meta.className = 'hero-meta';
      const year = (pick.release_date || pick.first_air_date || '').toString().slice(0, 4);
      if (year) { const pill = document.createElement('span'); pill.className = 'pill'; pill.textContent = year; meta.appendChild(pill); }
      if (pick.rating != null && Number(pick.rating) > 0) {
        const pill = document.createElement('span'); pill.className = 'pill gold';
        pill.textContent = '★ ' + Number(pick.rating).toFixed(1); meta.appendChild(pill);
      }
      if (pick.media_type) { const pill = document.createElement('span'); pill.className = 'pill'; pill.textContent = String(pick.media_type).toUpperCase(); meta.appendChild(pill); }
      if ((pick.genres || []).length) { const pill = document.createElement('span'); pill.className = 'pill'; pill.textContent = pick.genres.slice(0, 2).join(' · '); meta.appendChild(pill); }
      heroActions.appendChild(meta);
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap';
      const watchBtn = document.createElement('a');
      watchBtn.className = 'btn btn-yellow';
      watchBtn.href = '/title/' + encodeURIComponent(pick.slug);
      watchBtn.textContent = '▶ Play';
      const infoBtn = document.createElement('a');
      infoBtn.className = 'btn';
      infoBtn.href = '/title/' + encodeURIComponent(pick.slug);
      infoBtn.textContent = 'More info';
      row.appendChild(watchBtn); row.appendChild(infoBtn);
      heroActions.appendChild(row);
    }
  }

  function card(p) {
    const a = document.createElement('a');
    a.className = 'poster-card';
    a.href = '/title/' + encodeURIComponent(p.slug);
    const img = document.createElement('img');
    img.src = homeImageUrl(p);
    if (!(p && p.backdrop_path) && p && p.tmdb_id) {
      img.dataset.tmdbId = String(p.tmdb_id);
      img.dataset.mediaType = String(p.media_type || 'movie');
    }
    img.alt = (p.title || 'Poster') + ' poster';
    img.loading = 'lazy';
    img.decoding = 'async';
    // Clean cards: no quality/1080P badge (user request)
    const badges = document.createElement('div');
    badges.className = 'badge-row home-badges';
    let genreLabel = '';
    if (Array.isArray(p.genres) && p.genres.length) genreLabel = String(p.genres[0]).toUpperCase();
    if (genreLabel) {
      const g = document.createElement('span');
      g.className = 'badge badge-genre';
      g.textContent = genreLabel;
      badges.appendChild(g);
    }
    const play = document.createElement('div');
    play.className = 'play-hint';
    play.innerHTML = '<span>▶</span>';
    const info = document.createElement('div');
    info.className = 'info';
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = p.title || 'Untitled';
    const meta = document.createElement('div');
    meta.className = 'meta';
    const year = (p.release_date || p.first_air_date || '').toString().slice(0, 4);
    meta.textContent = year || (p.media_type ? String(p.media_type).toUpperCase() : '');
    info.appendChild(title);
    info.appendChild(meta);
    a.appendChild(img);
    a.appendChild(badges);
    a.appendChild(play);
    a.appendChild(info);
    return a;
  }

  function renderCatalogPage() {
    const pages = Math.max(1, Math.ceil(catalogItems.length / CATALOG_PER_PAGE));
    catalogPage = Math.min(Math.max(1, catalogPage), pages);
    grid.innerHTML = '';
    catalogItems.slice((catalogPage - 1) * CATALOG_PER_PAGE, catalogPage * CATALOG_PER_PAGE).forEach(p => grid.appendChild(card(p)));
    try { fillMissingBackdrops(); } catch (e) {}
    const pager = document.getElementById('catalog-pagination');
    if (!pager) return;
    pager.hidden = pages <= 1;
    pager.innerHTML = '';
    if (pages <= 1) return;
    const make = (label, page, disabled = false, active = false) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      b.disabled = disabled; if (active) b.classList.add('active');
      b.setAttribute('aria-label', label === '‹' ? 'Previous page' : label === '›' ? 'Next page' : 'Page ' + label);
      b.onclick = () => { catalogPage = page; renderCatalogPage(); document.getElementById('catalog')?.scrollIntoView({behavior:'smooth',block:'start'}); };
      pager.appendChild(b);
    };
    make('‹', catalogPage - 1, catalogPage <= 1);
    const start = Math.max(1, Math.min(catalogPage - 2, pages - 4));
    const end = Math.min(pages, start + 4);
    for (let n = start; n <= end; n++) make(String(n), n, false, n === catalogPage);
    make('›', catalogPage + 1, catalogPage >= pages);
  }

  function chip(label, value, active) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (active ? ' active' : '');
    b.textContent = label;
    b.onclick = () => {
      category = value;
      const url = new URL(location.href);
      if (category) url.searchParams.set('category', category); else url.searchParams.delete('category');
      if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
      history.replaceState(null, '', url);
      load();
      nav.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      b.classList.add('active');
    };
    return b;
  }

  async function load() {
    try {
      const qs = new URLSearchParams();
      if (category) qs.set('category', category);
      if (q) qs.set('q', q);
      const r = await fetch('/api/catalog?' + qs.toString(), { cache: 'no-store' });
      if (!r.ok) throw new Error('Catalog API returned HTTP ' + r.status);
      const data = await r.json();
      const list = Array.isArray(data.items) ? data.items : (Array.isArray(data) ? data : []);
      let cats = Array.isArray(data.categories) ? data.categories : [];
      if (!cats.length) { try { const cr = await fetch('/api/categories', {cache:'no-store'}); if (cr.ok) { const cd = await cr.json(); cats = Array.isArray(cd.items) ? cd.items : []; } } catch (_) {} }

      countEl.textContent = list.length ? list.length + ' titles' : '0 titles';
      nav.innerHTML = '';
      nav.appendChild(chip('All', '', !category));
      cats.forEach(c => nav.appendChild(chip(c.name || c.slug, c.slug, category === c.slug)));

      grid.innerHTML = '';
      if (!list.length) {
        grid.innerHTML = '<p class="muted" style="grid-column:1/-1;padding:48px 0;text-align:center">No titles found. Publish movies or series from the bot or the panel.</p>';
        return;
      }
      catalogItems = list;
      catalogPage = 1;
      renderCatalogPage();
    } catch (err) {
      const safeMessage = String(err && err.message ? err.message : err).replace(/[<>&]/g, '');
      grid.innerHTML = '<div style="grid-column:1/-1;padding:40px 16px;text-align:center;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius)"><strong style="display:block;font-size:17px;margin-bottom:8px">Catalog temporarily unavailable</strong><p class="muted" style="margin-bottom:14px">' + safeMessage + '</p><button class="btn btn-yellow" type="button" id="catalog-retry">Try again</button></div>';
      const btn = document.getElementById('catalog-retry');
      if (btn) btn.onclick = load;
      countEl.textContent = 'Error';
    }
  }

  load();
})();
</script>
{% endblock %}

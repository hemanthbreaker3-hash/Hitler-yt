<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="HITLER YT · Movies & Series">
  <title>{% block title %}HITLER YT{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{
      color-scheme:dark;
      --bg:#0a0a0a;
      --bg2:#111;
      --card:#141414;
      --line:#2a2a2a;
      --text:#f5f5f5;
      --muted:#9ca3af;
      --yellow:#facc15;
      --yellow-dark:#eab308;
      --red:#dc2626;
      --red-dark:#b91c1c;
      --accent:#facc15;
      --radius:10px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font:400 14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      min-height:100vh;
    }
    a{color:inherit;text-decoration:none}
    button,input,select{font:inherit}
    .wrap{width:min(100% - 16px,1100px);margin:auto}
    /* Top bar */
    .topbar{
      height:52px;
      display:flex;
      align-items:center;
      background:#0d0d0d;
      border-bottom:1px solid #222;
      position:sticky;
      top:0;
      z-index:50;
    }
    .topbar-inner{
      width:min(100% - 16px,1100px);
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .topbar-logo{
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:800;
      font-size:16px;
      letter-spacing:.3px;
    }
    .topbar-logo img{
      width:34px;height:34px;border-radius:8px;object-fit:cover;
      border:1px solid rgba(250,204,21,.4);
    }
    .topbar-logo span{color:var(--yellow)}
    .topbar-links{display:flex;gap:10px;align-items:center}
    .topbar-links a{
      color:var(--muted);font-size:13px;padding:6px 10px;border-radius:6px;
      transition:color .15s,background .15s;
    }
    .topbar-links a:hover{color:#fff;background:#1a1a1a}
    /* Yellow CTA */
    .btn-yellow{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      background:var(--yellow);color:#111;font-weight:800;font-size:13px;
      padding:9px 16px;border-radius:8px;border:none;cursor:pointer;
      box-shadow:0 2px 12px rgba(250,204,21,.35);
      transition:transform .15s,box-shadow .15s,background .15s;
    }
    .btn-yellow:hover{background:var(--yellow-dark);transform:translateY(-1px);box-shadow:0 4px 16px rgba(250,204,21,.45)}
    .btn-yellow:active{transform:translateY(0)}
    /* Search */
    .search-bar{
      display:flex;gap:8px;align-items:center;
      background:#141414;border:1px solid #2a2a2a;border-radius:10px;
      padding:4px 4px 4px 14px;margin:14px 0;
    }
    .search-bar input{
      flex:1;min-width:0;background:transparent;border:none;outline:none;
      color:#fff;font-size:14px;padding:10px 0;
    }
    .search-bar input::placeholder{color:#6b7280}
    .search-bar button{
      background:var(--yellow);color:#111;border:none;border-radius:8px;
      padding:10px 18px;font-weight:800;cursor:pointer;font-size:13px;
    }
    .search-bar button:hover{background:var(--yellow-dark)}
    /* Announcement banners */
    .announce{
      margin:10px 0;border-radius:8px;overflow:hidden;
      font-size:12.5px;line-height:1.4;
    }
    .announce-red{
      background:linear-gradient(90deg,#7f1d1d,#991b1b);
      border:1px solid #b91c1c;color:#fecaca;
      padding:10px 14px;
    }
    .announce-dark{
      background:#1a1a1a;border:1px solid #333;color:#d1d5db;
      padding:10px 14px;
    }
    .announce a{color:var(--yellow);font-weight:700;text-decoration:underline}
    /* Poster grid */
    .poster-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
      gap:14px;
      margin-top:18px;
    }
    @media(min-width:640px){
      .poster-grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px}
    }
    .poster-card{
      background:#111;border:1px solid #222;border-radius:10px;overflow:hidden;
      transition:transform .18s,border-color .18s,box-shadow .18s;
    }
    .poster-card:hover{
      transform:translateY(-4px);
      border-color:rgba(250,204,21,.45);
      box-shadow:0 10px 28px rgba(0,0,0,.55);
    }
    .poster-card img{
      width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#1a1a1a;
    }
    .poster-card .info{
      padding:10px 10px 12px;
    }
    .poster-card .title{
      font-weight:700;font-size:13px;line-height:1.3;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
      margin-bottom:4px;
    }
    .poster-card .meta{
      font-size:11px;color:#9ca3af;line-height:1.35;
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    }
    /* Horizontal trending */
    .trending-row{
      display:flex;gap:10px;overflow-x:auto;padding:8px 0 12px;
      scrollbar-width:thin;scrollbar-color:#333 transparent;
    }
    .trending-row::-webkit-scrollbar{height:6px}
    .trending-row::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
    .trending-item{
      flex:0 0 110px;border-radius:8px;overflow:hidden;border:1px solid #222;
      background:#111;
    }
    .trending-item img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
    /* Section */
    .section-head{
      display:flex;justify-content:space-between;align-items:center;
      margin:22px 0 12px;gap:12px;
    }
    .section-head h2{font-size:17px;font-weight:800}
    .chip{
      display:inline-flex;align-items:center;gap:5px;
      background:#1a1a1a;border:1px solid #333;border-radius:20px;
      padding:5px 12px;font-size:12px;color:#d1d5db;cursor:pointer;
      transition:border-color .15s,color .15s;
    }
    .chip:hover,.chip.active{border-color:var(--yellow);color:var(--yellow)}
    .cat-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    main{padding:14px 0 80px}
    .footer{
      text-align:center;color:#555;font-size:12px;padding:24px 0 60px;
      border-top:1px solid #1f1f1f;
    }
    .muted{color:var(--muted)}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:40px;padding:0 14px;border:1px solid #333;border-radius:9px;
      background:#1a1a1a;color:#fff;cursor:pointer;
    }
    .btn:hover{border-color:var(--yellow);color:var(--yellow)}
    /* Mobile */
    @media(max-width:600px){
      .poster-grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px}
      .topbar-logo{font-size:14px}
      .section-head h2{font-size:15px}
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="topbar-logo" href="/" title="HITLER YT">
      <img src="/static/images/logo.jpg" alt="Logo" width="34" height="34" loading="eager">
      <span>HITLER</span> YT
    </a>
    <div class="topbar-links">
      <a href="/">Home</a>
      <a href="/?category=movies">Movies</a>
      <a href="/?category=web-series">Series</a>
      <a href="https://t.me/HiTLERYT" target="_blank" rel="noopener">Telegram</a>
    </div>
  </div>
</header>
<main>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>
<footer class="footer">
  <a href="https://t.me/HiTLERYT" target="_blank" rel="noopener">HITLER YT · @hitleryt</a>
</footer>
</body>
</html>

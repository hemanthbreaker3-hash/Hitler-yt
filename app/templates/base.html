<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f8ff">
  <meta name="description" content="{{ BRANDING }} — discover anime, movies and series.">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>{% block title %}{{ BRANDING }}{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{
      color-scheme:dark;
      /* Streaming cinema palette (Netflix/HBO-inspired) */
      --bg:#0a0a0c;
      --bg-elevated:#121214;
      --bg-card:#16161a;
      --bg-card-hover:#1e1e24;
      --line:rgba(255,255,255,.06);
      --line-strong:rgba(255,255,255,.12);
      --text:#f5f5f7;
      --muted:#8e8e98;
      --accent:#d8b36a;
      --accent-2:#f0d9a2;
      --accent-soft:rgba(167,139,250,.14);
      --cyan:#e8c77f;
      --prime:#f5c518;
      --danger:#ff5c5c;
      --radius:12px;
      --radius-sm:8px;
      --shadow:0 24px 60px rgba(0,0,0,.55);
      --font:"DM Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --font-display:"Outfit","DM Sans",system-ui,sans-serif;
      --max:1400px;
      --pad:4vw;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      margin:0;min-height:100vh;color:var(--text);
      font:500 15px/1.55 var(--font);
      background:
        radial-gradient(ellipse 80% 50% at 15% -15%,rgba(167,139,250,.12),transparent 55%),
        radial-gradient(ellipse 50% 40% at 90% 10%,rgba(34,211,238,.06),transparent 50%),
        #0a0a0c;
      letter-spacing:.01em;-webkit-font-smoothing:antialiased;
    }
    h1,h2,h3,h4,.brand-word{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em}
    a{color:inherit;text-decoration:none}
    button,input,select{font:inherit}
    img{max-width:100%;display:block}
    ::selection{background:rgba(139,92,246,.35);color:#fff}
    .wrap{width:min(100% - 28px,var(--max));margin-inline:auto}

    /* —— Top bar —— */
    .topbar{
      position:sticky;top:0;z-index:80;
      backdrop-filter:blur(20px) saturate(1.3);
      -webkit-backdrop-filter:blur(20px) saturate(1.3);
      background:linear-gradient(180deg,rgba(6,6,8,.92),rgba(6,6,8,.78));
      border-bottom:1px solid rgba(216,179,106,.14);
      transition:background .25s,border-color .25s;
    }
    .topbar-inner{
      width:min(100% - 28px,var(--max));margin:auto;min-height:64px;
      display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
      gap:14px;padding:10px 0;
    }
    .topbar-logo{display:inline-flex;align-items:center;gap:12px;transition:transform .2s ease}
    .topbar-logo:hover{transform:translateY(-1px)}
    .topbar-logo img{display:block;width:46px;height:46px;object-fit:contain;border-radius:10px;flex:0 0 auto}.topbar-logo img[src=""]{display:none}
    .brand-lockup{display:flex;align-items:center;gap:10px}
    .brand-mark{position:relative;width:34px;height:44px;display:grid;place-items:center}
    .brand-mark span{
      position:absolute;font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.2em;
      writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);
      background:linear-gradient(180deg,#22d3ee,#7c3aed);
      -webkit-background-clip:text;background-clip:text;color:transparent;opacity:.96;
    }
    .brand-mark::before{
      content:"";position:absolute;inset:4px 12px;
      border-left:2px solid var(--accent);border-right:2px solid rgba(30,187,255,.55);
      transform:skewY(-12deg);opacity:.9;
    }
    .brand-word{
      font-family:var(--font-display);font-size:clamp(1.05rem,2.5vw,1.45rem);
      line-height:1.12;letter-spacing:.19em;font-weight:800;text-transform:uppercase;
      background:linear-gradient(100deg,#fff 8%,#f4dfb2 48%,#c99b4b 88%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      text-shadow:0 10px 40px rgba(255,106,0,.18);
    }
    .brand-word{font-family:"Outfit",sans-serif!important;font-size:clamp(.78rem,2vw,1.1rem)!important;letter-spacing:.20em!important;text-shadow:0 4px 24px rgba(216,179,106,.22)}\n    .brand-word em{
      font-style:normal;font-weight:800;color:var(--cyan);
      background:none;-webkit-background-clip:unset;background-clip:unset;
      margin-left:4px;letter-spacing:.08em;
    }
    .topbar-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .topbar-links a{
      padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;
      color:var(--muted);border:1px solid transparent;
      transition:color .18s,background .18s,border-color .18s,transform .18s;
    }
    .topbar-links a:hover{color:var(--text);background:rgba(255,255,255,.05);border-color:var(--line);transform:translateY(-1px)}
    .topbar-links a.active{
      color:#140a02;background:linear-gradient(120deg,var(--accent),var(--accent-2));
      border-color:transparent;box-shadow:0 6px 20px rgba(139,92,246,.3);
    }

    /* —— Search —— */
    .search-bar{
      display:flex;align-items:center;gap:10px;
      background:linear-gradient(180deg,rgba(21,21,28,.95),rgba(13,13,18,.95));
      border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;margin:18px 0 14px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
      transition:border-color .2s,box-shadow .2s;
    }
    .search-bar:focus-within{border-color:rgba(139,92,246,.55);box-shadow:0 0 0 4px var(--accent-soft),0 10px 30px rgba(0,0,0,.3)}
    .search-bar i{color:var(--muted);font-size:14px}
    .search-bar input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:14px;padding:11px 0;font-weight:500}
    .search-bar input::placeholder{color:#6b6b78}
    .search-bar button{
      border:0;border-radius:999px;cursor:pointer;padding:11px 20px;font-weight:800;font-size:13px;
      background:linear-gradient(125deg,var(--accent),var(--accent-2));color:#180b02;
      transition:filter .15s,transform .15s;
    }
    .search-bar button:hover{filter:brightness(1.08);transform:translateY(-1px)}

    /* —— Banners —— */
    .announce{border-radius:var(--radius-sm);padding:13px 16px;margin:8px 0;font-size:13px;line-height:1.45;font-weight:500;border:1px solid var(--line)}
    .announce-red{background:linear-gradient(135deg,rgba(255,106,0,.13),rgba(255,106,0,.04));border-color:rgba(139,92,246,.3);color:#ffd3b7}
    .announce-dark{background:var(--bg-card);color:var(--muted)}
    .announce a{color:var(--accent);font-weight:700}

    /* —— Sections —— */
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 16px}
    .section-head h2{font-size:clamp(1.1rem,2.2vw,1.4rem);display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.03em}
    .section-head h2::before{content:"";width:5px;height:1.1em;border-radius:5px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
    .chip,.cat-nav .chip,select.chip{
      display:inline-flex;align-items:center;gap:6px;background:var(--bg-card);border:1px solid var(--line);
      border-radius:999px;padding:8px 15px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;
      transition:border-color .15s,color .15s,background .15s,transform .15s;
    }
    .chip:hover,select.chip:hover{color:var(--text);border-color:var(--line-strong);transform:translateY(-1px)}
    .chip.active,.cat-nav .chip.active{color:#ffad70;border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.16)}
    .cat-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

    /* —— Poster grid —— */
    .poster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:18px;margin-top:8px}
    .poster-card{
      position:relative;overflow:hidden;border-radius:14px;
      background:linear-gradient(180deg,#1a1a22,#121218);
      border:1px solid rgba(255,255,255,.07);box-shadow:0 10px 26px rgba(0,0,0,.3);
      transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;
      content-visibility:auto;contain-intrinsic-size:260px 360px;
    }
    .poster-card:hover{
      transform:translateY(-8px) scale(1.015);border-color:rgba(139,92,246,.6);
      box-shadow:0 22px 44px rgba(0,0,0,.5),0 0 28px rgba(139,92,246,.16);
    }
    .poster-card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#1a1d28;transition:transform .4s ease}
    .poster-card:hover img{transform:scale(1.06)}
    .poster-card .info{padding:12px 13px 14px;background:linear-gradient(180deg,transparent,rgba(8,8,10,.6))}
    .poster-card .title{
      font-family:var(--font-display);font-weight:800;font-size:13px;line-height:1.3;letter-spacing:-.01em;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px;
    }
    .poster-card .meta{font-size:11px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}


    /* Rating / year badges on posters */
    .poster-card .badge-row{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;z-index:2;pointer-events:none}
    .poster-card .badge{font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px;backdrop-filter:blur(8px);letter-spacing:.02em}
    .poster-card .badge-rating{background:rgba(0,0,0,.72);color:var(--prime);border:1px solid rgba(245,197,24,.25)}
    .poster-card .badge-year{background:rgba(0,0,0,.55);color:#e5e7eb;border:1px solid rgba(255,255,255,.1);margin-left:auto}
    .poster-card .play-hint{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);opacity:0;transition:opacity .25s;z-index:1}
    .poster-card:hover .play-hint{opacity:1}
    .poster-card .play-hint span{width:48px;height:48px;border-radius:50%;background:rgba(167,139,250,.95);display:grid;place-items:center;color:#0a0a0c;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .row-slider{display:flex;gap:12px;overflow-x:auto;padding:4px 0 16px;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none}
    .row-slider::-webkit-scrollbar{display:none}
    .row-slider .poster-card{flex:0 0 150px;scroll-snap-align:start}
    @media(min-width:900px){.row-slider .poster-card{flex-basis:170px}}
    .hero-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
    .hero-meta .pill{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#e5e7eb}
    .hero-meta .pill.gold{color:var(--prime);border-color:rgba(245,197,24,.35);background:rgba(245,197,24,.1)}

        .trending-row{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 16px;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:#3a3a44 transparent}
    .trending-row::-webkit-scrollbar{height:6px}
    .trending-row::-webkit-scrollbar-thumb{background:#3a3a44;border-radius:3px}
    .trending-item{
      flex:0 0 125px;scroll-snap-align:start;border-radius:13px;overflow:hidden;
      border:1px solid var(--line);background:var(--bg-card);
      transition:transform .22s,border-color .22s,box-shadow .22s;position:relative;
    }
    .trending-item:hover{transform:translateY(-4px) scale(1.02);border-color:rgba(139,92,246,.55);box-shadow:0 14px 30px rgba(0,0,0,.45)}
    .trending-item img{width:100%;aspect-ratio:2/3;object-fit:cover}

    main{padding:8px 0 110px}
    .footer{text-align:center;color:#5a5a66;font-size:12px;padding:32px 0 56px;border-top:1px solid var(--line);margin-top:20px}
    .footer strong{color:var(--muted);font-family:var(--font-display)}
    .muted{color:var(--muted)}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      min-height:44px;padding:0 18px;border-radius:var(--radius-sm);
      border:1px solid var(--line);background:var(--bg-card);color:var(--text);
      cursor:pointer;font-weight:700;font-size:13px;
      transition:border-color .15s,color .15s,transform .15s,background .15s,box-shadow .15s;
    }
    .btn:hover{border-color:rgba(255,106,0,.5);color:var(--accent-2);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.35)}
    .btn-yellow,.btn-accent{
      background:linear-gradient(125deg,var(--accent),var(--accent-2));color:#180b02;border:0;font-weight:800;
      box-shadow:0 8px 22px rgba(139,92,246,.3);
    }
    .btn-yellow:hover,.btn-accent:hover{filter:brightness(1.07);color:#180b02;box-shadow:0 10px 28px rgba(139,92,246,.42)}

    /* —— Page hero strip (default / fallback, no backdrop) —— */
    .page-hero{
      position:relative;overflow:hidden;margin:16px 0 20px;padding:clamp(26px,5vw,52px);
      min-height:160px;border:1px solid rgba(255,125,39,.22);border-radius:22px;
      display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
      background:linear-gradient(105deg,rgba(255,106,0,.18),rgba(28,17,35,.75) 55%,rgba(10,10,14,.97)),
        radial-gradient(circle at 85% 15%,rgba(30,187,255,.18),transparent 36%);
      box-shadow:0 22px 60px rgba(0,0,0,.3);
    }
    .page-hero:after{
      content:"アニメ";position:absolute;right:4%;bottom:-32px;
      font:900 clamp(4rem,12vw,8rem)/1 var(--font-display);color:rgba(255,255,255,.035);
      letter-spacing:-.08em;pointer-events:none;
    }
    .page-hero h1{font-size:clamp(1.8rem,5vw,3.2rem);background:linear-gradient(100deg,#fff 12%, #c4b5fd 55%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
    .page-hero p{color:#c7c2cb;font-size:14px;max-width:54ch}

    /* —— Cinematic backdrop hero (title / watch pages) —— */
    .backdrop-hero{/* cinematic billboard */
      position:relative;overflow:hidden;border-radius:22px;margin:14px 0 22px;
      min-height:clamp(220px,42vw,420px);border:1px solid rgba(255,255,255,.08);
      box-shadow:0 26px 70px rgba(0,0,0,.5);
    }
    .backdrop-hero .backdrop-img{
      position:absolute;inset:0;background-size:cover;background-position:center 20%;
      transform:scale(1.02);filter:saturate(1.08);
    }
    .backdrop-hero .backdrop-scrim{
      position:absolute;inset:0;
      background:
        linear-gradient(0deg,var(--bg) 2%,rgba(6,6,8,.78) 32%,rgba(6,6,8,.25) 62%,rgba(6,6,8,.08) 100%),
        linear-gradient(100deg,rgba(6,6,8,.9) 0%,rgba(6,6,8,.45) 42%,rgba(6,6,8,.08) 72%);
    }
    .backdrop-hero .backdrop-content{position:relative;z-index:2;padding:clamp(20px,4vw,40px)}
    @media(max-width:640px){.backdrop-hero{border-radius:16px;min-height:220px}}

    @media(max-width:640px){
      body{font-size:14px}
      .wrap,.topbar-inner{width:min(100% - 20px,var(--max))}
      .poster-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
      .topbar-links a{padding:7px 11px;font-size:12px}
      .brand-word{font-size:1.04rem}
      .brand-mark{display:grid;width:25px}
      .page-hero{padding:22px 18px;min-height:135px}
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .fade-up{animation:fadeUp .45s ease both}

    /* —— Generic elevated card (used by watch/admin pages) —— */
    .card{
      background:linear-gradient(165deg,rgba(21,21,28,.96),rgba(13,13,18,.96));
      border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:0 14px 36px rgba(0,0,0,.3);
      transition:border-color .2s,box-shadow .2s;
    }
    .card:hover{border-color:var(--line-strong)}


    /* OTT polish: soft violet + aqua accents, restrained glow, and accessible focus. */
    :root{--line:rgba(148,163,184,.14);--line-strong:rgba(148,163,184,.28);--radius:18px;--shadow:0 24px 64px rgba(0,0,0,.48)}
    body{background:radial-gradient(ellipse 60% 38% at 12% -8%,rgba(124,58,237,.16),transparent 58%),radial-gradient(ellipse 48% 34% at 94% 0%,rgba(34,211,238,.10),transparent 56%),linear-gradient(180deg,#080b12,#070910 52%,#05070b)}
    .topbar{border-bottom-color:rgba(139,92,246,.18);background:linear-gradient(180deg,rgba(7,9,16,.94),rgba(7,9,16,.78))}
    .brand-mark::before{border-left-color:#8b5cf6;border-right-color:rgba(34,211,238,.65)}
    .brand-mark span{background:linear-gradient(180deg,#22d3ee,#8b5cf6);-webkit-background-clip:text;background-clip:text}
    .brand-word{background:linear-gradient(100deg,#fff 10%,#c4b5fd 48%,#22d3ee 90%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 10px 40px rgba(124,58,237,.14)}
    .brand-word{font-family:"Outfit",sans-serif!important;font-size:clamp(.78rem,2vw,1.1rem)!important;letter-spacing:.20em!important;text-shadow:0 4px 24px rgba(216,179,106,.22)}\n    .brand-word em{color:#22d3ee}
    .topbar-links a.active,.btn-yellow,.btn-accent,.search-bar button{background:linear-gradient(120deg,#7c3aed,#22d3ee);color:#071018;border-color:transparent;box-shadow:0 8px 24px rgba(124,58,237,.22)}
    .section-head h2::before{background:linear-gradient(180deg,#8b5cf6,#22d3ee)}
    .chip.active,.cat-nav .chip.active{color:#c4b5fd;border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.13)}
    .poster-card:hover{border-color:rgba(139,92,246,.55);box-shadow:0 22px 44px rgba(0,0,0,.5),0 0 24px rgba(124,58,237,.13)}
    .trending-item:hover{border-color:rgba(34,211,238,.45)}
    .search-bar:focus-within{border-color:rgba(139,92,246,.55);box-shadow:0 0 0 4px rgba(139,92,246,.12),0 10px 30px rgba(0,0,0,.3)}
    .backdrop-hero .backdrop-scrim{background:linear-gradient(0deg,var(--bg) 1%,rgba(7,9,16,.82) 35%,rgba(7,9,16,.28) 70%,rgba(7,9,16,.06)),linear-gradient(100deg,rgba(7,9,16,.9),rgba(7,9,16,.34) 45%,transparent 75%)}
    .poster-card,.card,.link-box,.related-groups{border-color:var(--line);background:linear-gradient(160deg,rgba(20,25,36,.96),rgba(10,13,20,.96))}
    .btn,.pbtn,.nav-btn,.groups-pager .pg-btn{transition:transform .18s,border-color .18s,background .18s,box-shadow .18s}
    .btn:hover,.pbtn:hover,.nav-btn:hover,.groups-pager .pg-btn:hover{transform:translateY(-1px);border-color:rgba(34,211,238,.35)}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #22d3ee;outline-offset:3px}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

    {% block head %}{% endblock %}

    /* Unified white / blue / red / green glass theme */
    :root{color-scheme:light;--bg:#f3f8ff;--bg-elevated:#ffffff;--bg-card:rgba(255,255,255,.72);--bg-card-hover:rgba(255,255,255,.92);--line:rgba(40,105,190,.14);--line-strong:rgba(30,100,200,.26);--text:#13233b;--muted:#58708d;--accent:#2563eb;--accent-2:#38bdf8;--accent-soft:rgba(37,99,235,.10);--cyan:#0ea5e9;--danger:#e11d48;--shadow:0 18px 50px rgba(32,83,150,.12)}
    body{background:radial-gradient(ellipse 80% 40% at 10% -10%,rgba(59,130,246,.16),transparent 65%),radial-gradient(ellipse 55% 35% at 90% 0%,rgba(239,68,68,.09),transparent 60%),linear-gradient(135deg,#f7fbff,#eef6ff 55%,#fff);color:var(--text)}
    .topbar{background:rgba(255,255,255,.72);border-bottom:1px solid rgba(59,130,246,.16);box-shadow:0 8px 30px rgba(40,90,150,.06)}
    .brand-word{background:linear-gradient(100deg,#2563eb,#e11d48 65%,#16a34a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
    .brand-word{font-family:"Outfit",sans-serif!important;font-size:clamp(.78rem,2vw,1.1rem)!important;letter-spacing:.20em!important;text-shadow:0 4px 24px rgba(216,179,106,.22)}\n    .brand-word em{color:#16a34a}
    .glass,.card,.item-card,.title-card,.search-panel,.modal,.link-box,.group-block,.admin-card{background:rgba(255,255,255,.68)!important;border:1px solid rgba(59,130,246,.16)!important;backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);box-shadow:0 12px 36px rgba(31,78,140,.08)}
    button,.btn,.nav-btn,.pg-btn{color:#17365f!important;background:rgba(255,255,255,.76)!important;border-color:rgba(37,99,235,.2)!important}
    .btn.accent,.btn-primary,.accent{background:linear-gradient(135deg,#2563eb,#38bdf8)!important;color:#fff!important;border:0!important}
    .btn-danger,.danger{background:linear-gradient(135deg,#e11d48,#fb7185)!important;color:#fff!important}
    .success,.btn-success{background:linear-gradient(135deg,#16a34a,#4ade80)!important;color:#fff!important}
    input,select,textarea{background:rgba(255,255,255,.82)!important;color:#17365f!important;border-color:rgba(37,99,235,.2)!important}
    .topbar-links a,.nav-link{color:#315477}
    .topbar-links a:hover,.nav-link:hover{color:#2563eb}
    .footer,footer{color:#58708d}
    .poster,.poster img,.cover{box-shadow:0 16px 38px rgba(30,64,120,.14)}
    @media(prefers-reduced-motion:no-preference){.card,.item-card,.title-card,.btn{transition:transform .2s ease,box-shadow .2s ease,background .2s ease}.card:hover,.item-card:hover,.title-card:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(37,99,235,.13)}}

    /* HITLER YT signature: restrained, cinematic, responsive */
    :root{--bg:#08090d;--bg-elevated:#101116;--bg-card:#14151b;--bg-card-hover:#1b1d25;--line:rgba(255,255,255,.085);--line-strong:rgba(255,255,255,.16);--text:#f7f7fa;--muted:#a0a1ac;--accent:#b7a0ff;--accent-2:#e4bd82;--accent-soft:rgba(183,160,255,.13);--radius:16px;--shadow:0 24px 70px rgba(0,0,0,.48)}
    body{background:radial-gradient(ellipse 70% 45% at 15% -12%,rgba(183,160,255,.12),transparent 58%),radial-gradient(ellipse 50% 35% at 90% 0%,rgba(228,189,130,.07),transparent 58%),#08090d;letter-spacing:.015em}
    .topbar{background:rgba(7,8,11,.88);border-bottom:1px solid rgba(255,255,255,.08)}

    .topbar-logo img{width:46px;height:46px;border-radius:12px;object-fit:contain;background:rgba(255,255,255,.04)}

    .topbar-links a{letter-spacing:.09em;text-transform:uppercase;font-size:11px}
    .topbar-links a.active{color:#101014;background:linear-gradient(120deg,#e8d9ff,#d8b77e);box-shadow:0 7px 24px rgba(228,189,130,.13)}
    .wrap{width:min(100% - 36px,1320px)}
    .search-bar{background:rgba(18,19,25,.88);border-color:rgba(255,255,255,.1)}
    .search-bar button,.btn-yellow,.btn.accent{background:linear-gradient(120deg,#e8d9ff,#d8b77e)!important;color:#17151b!important}

    .poster-card{border-radius:13px;background:#111218;border-color:rgba(255,255,255,.09)}
    .poster-card:hover{border-color:rgba(228,189,130,.55);box-shadow:0 22px 44px rgba(0,0,0,.5),0 0 24px rgba(228,189,130,.1)}
    .footer{color:#777985;border-top:1px solid rgba(255,255,255,.07);padding-top:18px;margin-top:46px}
    @media(max-width:600px){.topbar-inner{gap:8px}.topbar-logo{gap:8px}.topbar-logo img{width:38px;height:38px}.brand-word{font-size:.78rem;letter-spacing:.11em}.topbar-links a{padding:8px 10px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="topbar-logo" href="/" title="{{ BRANDING }} Home">
        {% if LOGO_URL %}<img src="{{ LOGO_URL }}" alt="{{ BRANDING }} logo" width="42" height="42" loading="eager">{% else %}<img src="/static/images/cinema-mark.png" alt="{{ BRANDING }} logo" width="42" height="42">{% endif %}
        <span class="brand-lockup"><span class="brand-word">{{ BRANDING }}</span></span>
      </a>
      <nav class="topbar-links" aria-label="Primary">
        <a href="/" class="{% block nav_home %}{% endblock %}">Home</a>
        <a href="/search" class="{% block nav_search %}{% endblock %}">Search</a>
        <a href="/panel">Panel</a>
      </nav>
    </div>
  </header>
  <main class="wrap fade-up">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer wrap">
    <strong>{{ BRANDING }}</strong> · Stream &amp; discover
  </footer>
</body>
</html>
